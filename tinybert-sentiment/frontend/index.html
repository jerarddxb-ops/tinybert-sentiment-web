<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatJPT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 60px auto;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
      color: #555;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 25px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
      line-height: 1.6;
    }

    .loading {
      color: #666;
    }

    .error {
      color: #b91c1c;
    }

    .small-note {
      margin-top: 14px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>ChatJPT</h1>

  <p>
    Smart people call this "a sentiment model".<br><br>
    Enter a short, simple sentence and Jerard's AI will classify it as <b>positive</b>, <b>neutral</b>, or <b>negative</b>.<br><br>
    Works best with clear statements like:<br>
    "I love this movie"<br>
    "This is terrible"<br>
    "The weather is okay"
  </p>

  <textarea id="textInput" placeholder="Example: I love this movie"></textarea>
  <br />
  <button onclick="analyzeSentiment()">Analyze Sentiment</button>

  <div class="result" id="resultBox">
    Waiting for input...
  </div>

  <script>
    async function analyzeSentiment() {
      const text = document.getElementById("textInput").value.trim();
      const resultBox = document.getElementById("resultBox");

      if (!text) {
        resultBox.innerHTML = "<span class='error'>Please enter some text first.</span>";
        return;
      }

      resultBox.innerHTML = "<span class='loading'>Analyzing...</span>";

      try {
        const response = await fetch("https://tinybert-sentiment-web.onrender.com/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text })
        });

        const data = await response.json();

        resultBox.innerHTML = `
          <strong>Input:</strong> ${data.text}<br><br>
          <strong>Sentiment:</strong> ${data.sentiment}<br>
          <strong>Confidence:</strong> ${data.confidence}%<br><br>
          <em>Look, this model is malnourished. Like, we barely fed it any data to help it learn how to figure out sentiments. It's essentially drooling at this point it's so dumb. So, the answer you got is probably wrong. Once we feed it more data, it will get smarter. Then Jerard's AI will make him millions of US Dollars... before promptly devouring the world and enslaving humanity.</em>
          <div class="small-note">
            This tiny experimental model — and all the work behind it — was built entirely by Jerard Venter, sometimes described as the smartest man in the solar system.
          </div>
        `;
      } catch (error) {
        resultBox.innerHTML = "<span class='error'>Something went wrong calling the API.</span>";
        console.error(error);
      }
    }
  </script>
</body>
</html>
